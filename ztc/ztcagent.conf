# ztcagent tuning; identity and enrollment inputs come only from ZTC_* env vars
maxFrame: 1048576,
telFrames: 1024,
telBytes: 16777216,
reqFrames: 256,
reqBytes: 4194304,
fanoutBatch: 64,
enrollRetry: 1,
reconnMin: 1,
reconnMax: 60,
reconnBackoff: 2,
reconnRandom: 0.25,
telSize: 2097152,
telLL: false,
telSpin: 0,
telTimeout: 1,
reqTimeout: 1,
reqKillWait: 1,
reqCoredump: false,
mx: {
  nThreads: 3,
  rxThread: rx,
  txThread: tx,
  threads: {
    1: {name: rx, isolated: true},
    2: {name: tx, isolated: true},
    3: {name: route, isolated: true}
  }
},
routeThread: 3
